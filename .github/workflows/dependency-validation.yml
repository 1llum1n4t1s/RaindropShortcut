name: Dependency validation

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: bun-security
      pr:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      merge_sha:
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    needs: security-guard
    if: always() && needs.security-guard.result == 'success' && (inputs.mode == 'bun-security' || github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.mode == 'bun-security' && format('refs/pull/{0}/merge', inputs.pr) || (github.sha) }}
          fetch-depth: 2
      - name: Verify security merge commit and parents
        if: inputs.mode == 'bun-security'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
      - name: Setup Bun
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json
      - name: Validate native AMO listing HTTP boundary
        run: pwsh -NoProfile -File scripts/Test-AmoListing.ps1 -WorkDirectory "$RUNNER_TEMP/amo-listing-tests"
      - name: Install locked dependencies
        run: bun run deps
      - name: Validate dependency security patches
        run: bun run test:dependencies
      - name: Sync support assets
        run: bun --bun run sync:support
      - name: Validate 2
        run: bun --bun run test
      - name: Validate 3
        run: bun --bun run build
  security-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        if: inputs.mode == 'bun-security'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Prepare trusted native Bun
        if: inputs.mode == 'bun-security'
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json
      - name: Validate security PR using trusted code
        if: inputs.mode == 'bun-security'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          bun scripts/Validate-SecurityMerge.mjs
      - name: Preserve ordinary validation entry points
        if: inputs.mode != 'bun-security'
        shell: bash
        run: echo 'Ordinary validation does not require the security PR guard'
  security-result:
    if: always() && inputs.mode == 'bun-security'
    needs: [security-guard, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e 'length > 1 and all(.[]; .result == "success")'
