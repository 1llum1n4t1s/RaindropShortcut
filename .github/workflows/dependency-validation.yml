name: Dependency validation

# main への push と全 PR（Dependabot 以外も）で本体の検証を走らせる。
# 版タグ v<x.y.z> の公開 workflow（publish.yml）も公開前に同じ test を実行する。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 同じ PR の古い実行は取り消す（main push は取り消さず全件検証する）。
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Setup Bun
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json
      - name: Validate native AMO listing HTTP boundary
        run: pwsh -NoProfile -File scripts/Test-AmoListing.ps1 -WorkDirectory "$RUNNER_TEMP/amo-listing-tests"
      - name: Install locked dependencies
        run: bun run deps
      - name: Validate dependency security patches
        run: bun run test:dependencies
      - name: Sync support assets
        run: bun --bun run sync:support
      - name: Validate 2
        run: bun --bun run test
      - name: Validate 3
        run: bun --bun run build
