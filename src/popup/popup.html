<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- ログイン画面 -->
  <div id="screen-login" class="screen">
    <div class="login-container">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="48" height="48">
          <circle cx="24" cy="24" r="22.5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35" />
          <path d="M16 14h10c4 0 7 2.5 7 6.5 0 3-1.7 5.2-4.4 6L34 34h-5l-4.7-7H21v7h-5V14zm5 4v5h5c1.8 0 3-1 3-2.5S29.8 18 28 18h-7z" fill="currentColor" />
        </svg>
      </div>
      <div class="login-meta">
        <span class="eyebrow">Raindrop · Index</span>
      </div>
      <h1 class="login-title">ブックマークを<br>一望する。</h1>
      <p class="login-desc">Raindrop.io と接続して、お気に入りのコレクションをワンクリックで開きます。</p>
      <button id="btn-login" class="btn-primary">
        <span>Raindrop.io でログイン</span>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" />
        </svg>
      </button>
      <p id="login-error" class="error-message" hidden></p>
      <span class="login-foot" id="login-foot"></span>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="screen-main" class="screen" hidden>
    <header class="main-header">
      <div class="header-title">
        <span class="header-marker" aria-hidden="true">○</span>
        <span id="collection-name" class="collection-name">すべて</span>
      </div>
      <button id="btn-settings" class="btn-icon" title="設定" aria-label="設定">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="2.5"/>
          <path d="M10 1.5v2M10 16.5v2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M1.5 10h2M16.5 10h2M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4"/>
        </svg>
      </button>
    </header>
    <div class="search-bar">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="7" cy="7" r="5"/>
        <path d="M11 11l3 3"/>
      </svg>
      <input type="search" id="search-input" placeholder="search..." autocomplete="off" aria-label="ブックマークを検索" />
      <span class="search-kbd" aria-hidden="true">/</span>
    </div>
    <div class="list-container">
      <ul id="bookmark-list" class="bookmark-list"></ul>
      <div id="loading-indicator" class="loading" hidden>
        <span class="pulse-dot" aria-hidden="true"></span>
        <span>読み込み中</span>
      </div>
    </div>
    <div id="empty-message" class="empty-message" hidden>ブックマークがありません</div>
  </div>

  <!-- 設定画面 -->
  <div id="screen-settings" class="screen" hidden>
    <header class="settings-header">
      <button id="btn-back" class="btn-icon" title="戻る" aria-label="戻る">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5l-5 5 5 5"/>
        </svg>
      </button>
      <span class="settings-title">設定</span>
      <span class="settings-spacer" aria-hidden="true"></span>
    </header>
    <div class="settings-body">
      <section class="settings-section">
        <h3 class="section-title"><span>Collections</span><span class="section-rule"></span></h3>
        <div id="collection-tree" class="collection-tree">
          <div class="loading"><span class="pulse-dot"></span><span>読み込み中</span></div>
        </div>
      </section>
      <section class="settings-section">
        <h3 class="section-title"><span>Open in</span><span class="section-rule"></span></h3>
        <div class="segmented" role="group">
          <button class="link-mode-btn" data-mode="newTab">新しいタブ</button>
          <button class="link-mode-btn" data-mode="current">現在のタブ</button>
        </div>
      </section>
      <section class="settings-section">
        <h3 class="section-title"><span>Theme</span><span class="section-rule"></span></h3>
        <div class="segmented" role="group">
          <button class="theme-btn selected" data-theme="auto">自動</button>
          <button class="theme-btn" data-theme="light">Light</button>
          <button class="theme-btn" data-theme="dark">Dark</button>
        </div>
      </section>
      <section class="settings-section settings-foot">
        <button id="btn-logout" class="btn-danger">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 11l3-3-3-3M13 8H5M8 14H3.5A1.5 1.5 0 012 12.5v-9A1.5 1.5 0 013.5 2H8"/>
          </svg>
          <span>ログアウト</span>
        </button>
      </section>
      <div class="support-footer">
        <kagayoi-support-footer product-id="raindrop-shortcut" firefox-data-consent></kagayoi-support-footer>
      </div>
    </div>
  </div>

  <script src="../lib/actions.js"></script>
  <script src="popup.js"></script>
  <script type="module" src="../shared/kagayoi-support-popup.js"></script>
  <script type="module" src="../shared/kagayoi-support-footer.js"></script>
</body>
</html>
