<div class="marquee">
  <div class="ghost">{{{ghost}}}</div>
  <div class="main" data-contain="main">
    <img class="icon" src="{{iconSrc}}" alt="">
    <div class="texts">
      <h1 class="mark" data-fit="mark" data-sizes="96,88,80,72,64,56,48" data-max-lines="1">{{brand}}</h1>
      <p class="tag" data-fit="tag" data-sizes="32,30,28,26,24" data-max-lines="1">{{{tagline}}}</p>
    </div>
  </div>
</div>
