<div class="slide hero">
  <div class="col left" data-contain="left" data-safe="left">
    <img class="icon" src="{{iconSrc}}" alt="">
    <h1 class="name" data-fit="name" data-sizes="64,56,48" data-max-lines="1">{{product}}</h1>
    <p class="lead" data-fit="tagline" data-sizes="24,22,20" data-max-lines="3">{{{tagline}}}</p>
    <div class="chips">{{{chips}}}</div>
  </div>
  <div class="right">{{{ui}}}</div>
</div>
